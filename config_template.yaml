######################################################################
# Configuration file for Artificial Modular Intelligence (AMI)
#   User-configurable settings (copied to ~/.ami/ami_config.yaml)

# Timezone; see pytz timezone names
timezone: America/Los_Angeles

# Listening: gap after speech ends before digest (seconds)
listening_patience: 2

# Listening: cancel interaction after this many seconds
listening_timeout: 30

# Minimum mic amplitude treated as speech
min_silence_threshold: 4000

# Detection threshold for openWakeWord (0-1)
detection_threshold: 0.3

# Server Host / Port (Flask blueprints)
host: 0.0.0.0
port: 5000

# openWakeWord model name
# Literal-ish: alexa | hey_mycroft | hey_jarvis | hey_rhasspy
hot_word: hey_rhasspy

# --- LLM backend ---
# backend: ollama | xai | anthropic
# ollama works offline/LAN (Pi local or Stronghold). Cloud needs keys in ~/.ami/.env
llm:
  backend: ollama
  model: llama3.2:1b
  ollama_base_url: http://127.0.0.1:11434/v1

# --- Speech-to-text ---
# backend: local (faster-whisper) | google (legacy cloud)
stt:
  backend: local
  model: tiny
  device: cpu

# --- Neighbors mesh ---
neighbors:
  mesh_port: 4177
  # internet_directory_url: https://neighbors.example/v1   # optional subscription / Stronghold

logging:
  stdout: True
  directory: logs
  # DEBUG | INFO | WARNING | ERROR | CRITICAL
  level: WARNING

# Enabled Headspaces (builtin package names under ami/builtin/)
enabled_headspaces:
  - corespace
  - markdown
  - neighbors
