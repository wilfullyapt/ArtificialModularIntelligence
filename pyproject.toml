[project]
name = "ami"
version = "0.1.0"
description = "LLM powered daily AI companion"
authors = [
    {name = "William Mawhinney",email = "wilmawhinney@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "gunicorn (>=23.0.0,<24.0.0)",
    "pytz (>=2025.1,<2026.0)",
    "pydantic (>=2.10.6,<3.0.0)",
    "langchain (>=0.3.20,<0.4.0)",
    "qrcode (>=8.0,<9.0)",
    "langchain-together (>=0.3.0,<0.4.0)",
    "numpy (>=1.26.4,<2.0.0)",
    "google-api-python-client (>=2.163.0,<3.0.0)",
    "google-auth-oauthlib (>=1.2.1,<2.0.0)",
    "fastapi (>=0.110.0,<1.0.0)",
    "uvicorn (>=0.27.1,<1.0.0)",
    "python-multipart (>=0.0.9,<1.0.0)",
    "grpcio (>=1.71.0,<2.0.0)",
    "grpcio-tools (>=1.71.0,<2.0.0)"
]

[tool.poetry.scripts]
run = "ami.main:run_prod"
ami = "ami.main:run_dev"
dev-ai = "ami.dev:run_ai_no_process_loop"
dev-be = "ami.main:run_backend"
test = "pytest:main"
test-unit = "pytest:main tests/unit"
test-integration = "pytest:main tests/integration"
test-e2e = "pytest:main tests/e2e"
test-ai = "pytest:main tests/unit/ai"
test-backend = "pytest:main tests/unit/backend"
test-gui = "pytest:main tests/unit/gui"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.5"
pytest-asyncio = "^0.23.5"
pytest-qt = "^4.4.0"
pytest-cov = "^4.1.0"
httpx = "^0.27.0"
aiohttp = "^3.9.3"
fastapi = {extras = ["all"], version = "^0.110.0"}

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=ami --cov-report=term-missing"
qt_api = "pyqt6"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
