[project]
name = "ArtificialModularIntelligence"
version = "0.1.0"
description = "Plugin based Voice and Visual LLM Assitant"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "anthropic>=0.54.0",
    "flask>=3.1.1",
    "gitpython>=3.1.44",
    "gunicorn>=23.0.0",
    "loguru>=0.7.3",
    "markdown>=3.8.2",
    "numpy>=1.26.4,<2.0",
    "openai>=1.90.0",
    "openwakeword>=0.6.0",
    "pyaudio>=0.2.14",
    "pydantic>=2.11.7",
    "pyqt6>=6.9.1",
    "python-dotenv>=1.1.0",
    "pytz>=2025.2",
    "pyyaml>=6.0.2",
    "qrcode>=8.2",
    "rich>=14.0.0",
    "soundfile>=0.13.1",
    "speechrecognition>=3.14.3",
    "watchdog>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ami"]

[project.scripts]
ami = "ami.main:main"

[tool.uv]
package = true

[tool.uv.sources]
ami = { path = "./ami", editable = true }
